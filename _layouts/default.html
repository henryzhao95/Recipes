<!doctype html>
<html lang="en"{% if page.layout == "recipe" %} class="recipe-scroll"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body data-baseurl="{{ site.baseurl }}">
    <main class="{% if page.layout == 'recipe' %}recipe-page{% elsif page.title == 'Home' %}home-page{% endif %}">
      {{ content }}
    </main>
    {% if page.layout == "recipe" %}
      <script src="{{ '/assets/js/recipe-table.js' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/recipe-videos.js' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/recipe-columns.js' | relative_url }}" defer></script>
      {% if page.servings %}
        <script src="{{ '/assets/js/recipe-servings.js' | relative_url }}" defer></script>
      {% endif %}
    {% endif %}
    {% if page.title == "Home" %}
      <script src="{{ '/assets/js/recipe-filters.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
